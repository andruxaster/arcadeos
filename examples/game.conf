# <USB>/arcadeos-games/<game-id>/game.conf
# game-id = folder name: lowercase a-z 0-9 _ -   (e.g. hotd4, vf5fs, outrun2sp)
NAME="The House of the Dead 4"
PLATFORM=lindbergh
# folder (relative to this file) that contains the game ELF
GAMEPATH="disk0/elf"
# optional: explicit ELF name if autodetection picks the wrong one
ELF=""
# optional extra linuxloader arguments
ARGS=""
